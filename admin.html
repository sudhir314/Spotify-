<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Studio</title>
    <link rel="stylesheet" href="css.css"> 
    <style>
        /* --- SCROLLING FIX --- */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh; 
            box-sizing: border-box;
            
            /* CRITICAL FIX: Overrides the main app's 'overflow: hidden' */
            overflow-y: auto !important; 
            height: auto !important;
            position: static !important;
        }

        /* --- ADMIN CONTAINER --- */
        .admin-container { 
            background: #181818; 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 4px 60px rgba(0,0,0,0.5);
            margin: 20px auto; /* Ensure space at top/bottom for scrolling */
        }
        
        h1, h2 { text-align: center; margin-bottom: 25px; color: #fff; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        
        label { display: block; margin-bottom: 8px; color: #b3b3b3; font-size: 0.9rem; font-weight: 600; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; background-color: #333; border: 1px solid #333; border-radius: 6px; color: white; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #1DB954; background: #404040; }

        button { width: 100%; padding: 14px; background-color: #1DB954; color: white; border: none; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #1ed760; transform: scale(1.02); }
        button:disabled { background-color: #555; cursor: not-allowed; transform: none; }

        /* LIST ITEMS */
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #282828; padding: 15px; margin-bottom: 12px; border-radius: 8px; transition: background 0.2s; }
        .song-item:hover { background: #333; }
        
        .delete-btn { background: transparent; border: 1px solid #ff5e5e; color: #ff5e5e; padding: 6px 16px; border-radius: 20px; width: auto; font-size: 0.85rem; margin: 0; cursor: pointer; }
        .delete-btn:hover { background: #ff5e5e; color: white; }
        
        /* LOGIN OVERLAY */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: #181818; padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Admin Studio</h2>
            <p style="color:#b3b3b3; margin-bottom:20px;">Enter server key.</p>
            <input type="password" id="adminPass" placeholder="Password">
            <button onclick="savePassword()">Unlock</button>
            <a href="index.html" style="color:#b3b3b3; display:block; margin-top:20px; text-decoration:none; font-size:0.9rem;">← Back to Home</a>
        </div>
    </div>

    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>Song Title</label>
                <input type="text" id="songName" placeholder="e.g. Blinding Lights" required>
            </div>
            <div class="form-group">
                <label>Artist</label>
                <input type="text" id="artist" placeholder="e.g. The Weeknd">
            </div>

            <label>Audio File (.mp3)</label>
            <div class="drop-zone" id="audioZone">
                <p>🎵 Drag Audio Here or Click</p>
                <input type="file" id="songFile" accept=".mp3" required>
            </div>

            <label>Cover Art</label>
            <div class="drop-zone" id="coverZone">
                <p>🖼️ Drag Image Here or Click</p>
                <input type="file" id="coverFile" accept="image/*" required>
            </div>

            <div style="margin:20px 0; display:flex; align-items:center;">
                <input type="checkbox" id="isFeatured" style="width:20px; height:20px; margin-right:10px;"> 
                <label style="margin:0; cursor:pointer;" for="isFeatured">Feature on Home Page</label>
            </div>
            <button type="submit" id="uploadBtn">Upload Song</button>
        </form>

        <h2 style="border-top:1px solid #333; padding-top:30px; margin-top:40px;">Library</h2>
        <div id="songListContainer"></div>
    </div>

    <script>
        const serverUrl = window.location.hostname === "localhost" ? "http://localhost:3000/" : "https://spotify-backend-sudhir314.onrender.com/";

        // --- TOAST NOTIFICATION SYSTEM ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            // If css.css is missing toast styles, this ensures basic visibility
            if (!container) { alert(message); return; }
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `✅ ${message}` : `❌ ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- DRAG & DROP LOGIC ---
        function setupDragDrop(zoneId, inputId) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            
            zone.addEventListener('click', () => input.click());
            
            input.addEventListener('change', () => {
                if(input.files.length > 0) zone.querySelector('p').innerText = "✅ " + input.files[0].name;
            });

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    input.files = e.dataTransfer.files;
                    zone.querySelector('p').innerText = "✅ " + e.dataTransfer.files[0].name;
                }
            });
        }
        setupDragDrop('audioZone', 'songFile');
        setupDragDrop('coverZone', 'coverFile');

        // --- AUTH ---
        function savePassword() {
            const pass = document.getElementById('adminPass').value;
            if(pass) {
                sessionStorage.setItem("adminSecret", pass);
                document.getElementById('loginOverlay').style.display = "none";
                fetchAndRenderSongs();
            }
        }
        if(sessionStorage.getItem("adminSecret")) {
            document.getElementById('loginOverlay').style.display = "none";
            fetchAndRenderSongs();
        }

        // --- UPLOAD ---
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = 'Uploading...';
            
            const formData = new FormData();
            formData.append('songName', document.getElementById('songName').value);
            formData.append('artist', document.getElementById('artist').value);
            formData.append('songFile', document.getElementById('songFile').files[0]);
            formData.append('coverFile', document.getElementById('coverFile').files[0]);
            formData.append('isFeatured', document.getElementById('isFeatured').checked);

            try {
                const res = await fetch(`${serverUrl}api/upload`, { 
                    method: 'POST', 
                    body: formData,
                    headers: { 'x-admin-password': sessionStorage.getItem("adminSecret") }
                });

                if (res.ok) {
                    showToast('Upload Successful!');
                    document.getElementById('uploadForm').reset();
                    document.querySelectorAll('.drop-zone p').forEach(p => p.innerText = p.innerText.includes('Audio') ? '🎵 Drag Audio Here' : '🖼️ Drag Image Here');
                    fetchAndRenderSongs(); 
                } else { throw new Error('Upload Failed'); }
            } catch (err) {
                showToast('Upload Failed. Check Password.', 'error');
                if(err.message.includes("Access Denied")) {
                    sessionStorage.removeItem("adminSecret");
                    setTimeout(() => window.location.reload(), 2000);
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload Song';
            }
        });

        async function fetchAndRenderSongs() {
            const container = document.getElementById('songListContainer');
            try {
                container.innerHTML = '<p style="text-align:center; color:#555;">Loading...</p>';
                const res = await fetch(`${serverUrl}api/songs`);
                const songs = await res.json();
                container.innerHTML = '';
                songs.forEach(song => {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `<span>${song.songName}</span> <button class="delete-btn" onclick="deleteSong('${song._id}', '${song.songName.replace(/'/g, "\\'")}')">Delete</button>`;
                    container.appendChild(item);
                });
            } catch (err) {}
        }

        window.deleteSong = async (id, name) => {
            if(!confirm(`Delete "${name}"?`)) return;
            try {
                const res = await fetch(`${serverUrl}api/songs/${id}`, { 
                    method: 'DELETE',
                    headers: { 'x-admin-password': sessionStorage.getItem("adminSecret") }
                });
                if(res.ok) { showToast('Deleted Successfully'); fetchAndRenderSongs(); }
                else { showToast('Delete Failed', 'error'); }
            } catch (err) { showToast('Error Deleting', 'error'); }
        }
    </script>
</body>
</html>
